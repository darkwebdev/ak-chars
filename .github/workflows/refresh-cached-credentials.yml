name: Refresh Cached Credentials

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh even if cache is valid'
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Check current cache
        run: |
          mkdir -p tests/integration
          echo '${{ secrets.CACHED_CREDENTIALS }}' > tests/integration/.credentials_cache.json

          echo "Current cache structure:"
          python3 << 'EOF'
          import json
          from datetime import datetime, timedelta

          with open('tests/integration/.credentials_cache.json') as f:
              data = json.load(f)

          print(f"  Email: {data.get('email', 'MISSING')}")
          print(f"  Server: {data.get('server', 'MISSING')}")
          print(f"  Timestamp: {data.get('timestamp', 'MISSING')}")

          if 'timestamp' in data:
              ts = datetime.fromisoformat(data['timestamp'])
              age = datetime.now() - ts
              print(f"  Age: {age.days} days, {age.seconds // 3600} hours")
              print(f"  Expired: {age > timedelta(days=1)}")

          print(f"  Has credentials: {'credentials' in data}")
          if 'credentials' in data:
              creds = data['credentials']
              print(f"    Has channel_uid: {'channel_uid' in creds}")
              print(f"    Has yostar_token: {'yostar_token' in creds}")
              if 'channel_uid' in creds:
                  print(f"    channel_uid length: {len(creds['channel_uid'])}")
              if 'yostar_token' in creds:
                  print(f"    yostar_token length: {len(creds['yostar_token'])}")
          EOF

      - name: Report cache health
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime, timedelta

          with open('tests/integration/.credentials_cache.json') as f:
              data = json.load(f)

          timestamp = data.get('timestamp')
          expired = True
          if timestamp:
              age = datetime.now() - datetime.fromisoformat(timestamp)
              expired = age > timedelta(days=1)

          if expired:
              print("::warning::CACHED_CREDENTIALS is expired or missing a real Yostar token.")
              print("This workflow is diagnostic only - it does NOT perform a real Yostar")
              print("re-authentication (a previous version of this step rewrote only the")
              print("timestamp field, which made the cache LOOK fresh without ever getting")
              print("a valid token; that was actively harmful and has been removed).")
              print("")
              print("A real refresh happens automatically inside the daily 'Integration")
              print("Tests' workflow's game_credentials fixture, which performs the full")
              print("email-code auth flow against Yostar. If that keeps failing with a")
              print("rate-limit error, wait out Yostar's cooldown - there is no shortcut")
              print("that re-authenticates without triggering the same rate limit.")
          else:
              print("✅ Cached credentials are still within their 1-day validity window.")
          EOF
