name: Integration Tests

"on":
  workflow_dispatch:
    # Manual trigger
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Set up credentials cache
        run: |
          mkdir -p tests/integration
          echo '${{ secrets.CACHED_CREDENTIALS }}' > tests/integration/.credentials_cache.json

      - name: Debug credentials cache
        run: |
          if [ -f tests/integration/.credentials_cache.json ]; then
            echo "Cache file exists"
            echo "File size: $(wc -c < tests/integration/.credentials_cache.json) bytes"
            echo "Cache structure (without sensitive data):"
            python3 << 'PYEOF'
          import json
          from datetime import datetime, timedelta
          with open('tests/integration/.credentials_cache.json') as f:
              data = json.load(f)
              print(f"  Email: {data.get('email', 'MISSING')}")
              print(f"  Server: {data.get('server', 'MISSING')}")
              print(f"  Timestamp: {data.get('timestamp', 'MISSING')}")
              if 'timestamp' in data:
                  ts = datetime.fromisoformat(data['timestamp'])
                  age = datetime.now() - ts
                  print(f"  Age: {age.days} days, {age.seconds // 3600} hours")
                  print(f"  Cache valid: {age < timedelta(days=1)}")
              print(f"  Has credentials: {'credentials' in data}")
              if 'credentials' in data:
                  print(f"  Has channel_uid: {'channel_uid' in data['credentials']}")
                  print(f"  Has yostar_token: {'yostar_token' in data['credentials']}")
          PYEOF
          else
            echo "ERROR: Cache file does not exist"
          fi

      - name: Verify production server is ready
        run: |
          curl -f https://ak-account-api-705516204230.us-central1.run.app/graphql \
            -H "Content-Type: application/json" \
            -d '{"query": "{ __typename }"}'

      - name: Run public API contract tests (no login required)
        # Anonymous Yostar endpoints (player search/expand) - no test-account
        # credentials involved, so none of the login-rate-limit fragility
        # below applies. Deliberately NOT soft-failed: a failure here is a
        # real signal that Yostar's public API contract changed or broke,
        # which is exactly what this workflow exists to catch.
        env:
          API_BASE_URL: https://ak-account-api-705516204230.us-central1.run.app
        run: |
          pytest tests/integration/test_public_api_contract.py -v -m integration --timeout=120 --tb=short

      - name: Run auth tests first (to refresh credentials if needed)
        env:
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_EMAIL_PASSWORD: ${{ secrets.TEST_ACCOUNT_EMAIL_PASSWORD }}
          TEST_ACCOUNT_SERVER: en
          API_BASE_URL: https://ak-account-api-705516204230.us-central1.run.app
        run: |
          echo "🔐 Running authentication tests to ensure credentials are fresh..."
          pytest tests/integration/test_auth_flow.py -v --timeout=300 --tb=short || echo "⚠️  Auth tests had failures, continuing..."

      - name: Run remaining integration tests
        id: roster_tests
        # Soft-fail: these tests depend on a real, non-rate-limited Yostar
        # session. Yostar rate limiting or an expired live token is an
        # external condition we can't control from CI, so it must not turn
        # the whole workflow red - see "Report on live test outcome" below.
        continue-on-error: true
        env:
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_EMAIL_PASSWORD: ${{ secrets.TEST_ACCOUNT_EMAIL_PASSWORD }}
          TEST_ACCOUNT_SERVER: en
          API_BASE_URL: https://ak-account-api-705516204230.us-central1.run.app
        run: |
          echo "🧪 Running remaining integration tests with fresh credentials..."
          pytest tests/integration/ -v -m integration --timeout=300 --tb=short \
            --ignore=tests/integration/test_auth_flow.py \
            --ignore=tests/integration/test_public_api_contract.py

      - name: Update credentials secret if refreshed
        # Runs after ALL live-credential-touching tests (auth tests +
        # roster tests), since the actual refresh/rate-limit-cooldown
        # bookkeeping happens in the `game_credentials` fixture used by the
        # roster tests, not the auth tests above. Running this any earlier
        # meant refresh/cooldown state was silently dropped every day.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f tests/integration/.credentials_cache.json ]; then
            echo "Credentials cache exists - checking if it should be updated"
            python3 << 'PYEOF'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta

          # Read current cache
          with open('tests/integration/.credentials_cache.json') as f:
              data = json.load(f)

          timestamp = datetime.fromisoformat(data['timestamp'])
          age = datetime.now() - timestamp

          # Check if cache has last_failed_refresh marker (means we hit rate limit)
          has_failure_marker = 'last_failed_refresh' in data
          recently_refreshed = age < timedelta(minutes=5)

          # Update secret if credentials were refreshed OR if failure marker was added
          should_update = recently_refreshed or has_failure_marker

          if should_update:
              if recently_refreshed:
                  print("✓ Credentials were refreshed during this test run")
              if has_failure_marker:
                  print("⚠️  Failed refresh attempt marked - updating secret to persist cooldown")

              print("📤 Automatically updating CACHED_CREDENTIALS secret...")

              # Automatically update the secret
              try:
                  # Read credentials file
                  with open('tests/integration/.credentials_cache.json', 'r') as f:
                      credentials_json = f.read()

                  # Update secret using gh CLI
                  result = subprocess.run(
                      ['gh', 'secret', 'set', 'CACHED_CREDENTIALS'],
                      input=credentials_json.encode(),
                      capture_output=True,
                      check=True
                  )

                  print("✅ CACHED_CREDENTIALS secret updated successfully!")
                  print(f"   Timestamp: {data['timestamp']}")
                  print(f"   Email: {data.get('email', 'REDACTED')}")
                  print(f"   Server: {data.get('server', 'N/A')}")
                  if has_failure_marker:
                      print(f"   Last failed refresh: {data.get('last_failed_refresh', 'N/A')}")

                  # Create notification file for artifact
                  with open('CREDENTIALS_UPDATED.txt', 'w') as f:
                      f.write("✅ Credentials cache updated!\n")
                      f.write(f"\nTimestamp: {data['timestamp']}\n")
                      f.write(f"Email: {data.get('email', 'N/A')}\n")
                      f.write(f"Server: {data.get('server', 'N/A')}\n")
                      if has_failure_marker:
                          f.write(f"Last failed refresh: {data.get('last_failed_refresh', 'N/A')}\n")

              except subprocess.CalledProcessError as e:
                  print(f"❌ Failed to update secret: {e}")
                  print(f"   stdout: {e.stdout.decode()}")
                  print(f"   stderr: {e.stderr.decode()}")
                  print("\n⚠️  Secret update failed - creating artifact for manual update")
                  print("   NOTE: the default GITHUB_TOKEN cannot write repository secrets.")
                  print("   A PAT with 'secrets: write' permission, stored as its own repo")
                  print("   secret, must be used here instead for this to ever succeed.")

                  # Create file to signal manual update needed
                  with open('CREDENTIALS_UPDATE_NEEDED.txt', 'w') as f:
                      f.write("⚠️  Automatic secret update failed.\n")
                      f.write("Cache file has important updates that need to be persisted.\n")
                      f.write("Update the CACHED_CREDENTIALS secret with the contents of .credentials_cache.json\n")
                      f.write(f"\nTimestamp: {data['timestamp']}\n")
                      f.write(f"Email: {data.get('email', 'N/A')}\n")
                      f.write(f"Server: {data.get('server', 'N/A')}\n")
                      if has_failure_marker:
                          f.write(f"Last failed refresh: {data.get('last_failed_refresh', 'N/A')}\n")
                      f.write("\nCommand to update manually:\n")
                      f.write("  cat tests/integration/.credentials_cache.json | gh secret set CACHED_CREDENTIALS\n")
          else:
              print("Cache was not updated during this run (no refresh or failure marker)")
          PYEOF
          else
            echo "No credentials cache file found"
          fi

      - name: Upload credentials if updated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-credentials-cache
          path: |
            tests/integration/.credentials_cache.json
            CREDENTIALS_UPDATE_NEEDED.txt
            CREDENTIALS_UPDATED.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report on live test outcome
        if: always()
        run: |
          if [ "${{ steps.roster_tests.outcome }}" = "failure" ]; then
            echo "::warning::Live integration tests failed - this is expected when the Yostar test account is rate-limited or its cached token has expired, and does not indicate a code regression. Check the 'updated-credentials-cache' artifact and job logs for details."
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Integration tests workflow failed outside of the known live-credential flakiness. Check the logs for details."
